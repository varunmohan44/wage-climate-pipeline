version: 2

models:
  - name: fct_labor_conditions
    description: >
      Wide analytical labor table. stg_labor is the spine — one row per
      country/year where ILOSTAT has data. World Bank economic context and
      ND-GAIN vulnerability scores are left-joined; nulls preserved so downstream
      consumers apply their own coverage thresholds. Grain: (country_code, year).

      Every row has at least one ILOSTAT observation, but that may be only
      informality_rate with all earnings columns null. in_economic/in_gain/in_labor
      reflect country-level pipeline coverage, not year-level — in_economic=true
      doesn't guarantee non-null economic columns for every year.
    meta:
      owner: pipeline
      domain: labor
      update_cadence: monthly
    columns:

      - name: country_code
        description: "ISO 3166-1 alpha-3 country code (from dim_countries)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_code

      - name: country_name
        description: "Canonical country name (World Bank → ND-GAIN → ILOSTAT preference)"
        tests:
          - not_null

      - name: year
        description: "Calendar year of the ILOSTAT observation"
        tests:
          - not_null

      - name: in_economic
        description: "True if this country appears in the World Bank WDI pipeline"

      - name: in_gain
        description: "True if this country appears in the ND-GAIN pipeline"

      - name: in_labor
        description: "True if this country appears in the ILOSTAT pipeline (always true given the spine)"

      # --- ILOSTAT labor indicators ---

      - name: avg_nominal_earnings_total
        description: "Average nominal earnings, all workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_T)"

      - name: avg_nominal_earnings_male
        description: "Average nominal earnings, male workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_M)"

      - name: avg_nominal_earnings_female
        description: "Average nominal earnings, female workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_F)"

      - name: gender_wage_gap_pct
        description: "Gender wage gap by occupation as a percentage (EAR_GGAP_OCU_RT)"

      - name: informality_rate_total
        description: "Informal employment rate, all workers (EMP_2IFL_SEX_RT, SEX_T)"

      - name: informality_rate_male
        description: "Informal employment rate, male workers (EMP_2IFL_SEX_RT, SEX_M)"

      - name: informality_rate_female
        description: "Informal employment rate, female workers (EMP_2IFL_SEX_RT, SEX_F)"

      - name: total_employment_nb
        description: "Total employment count across all statuses (EMP_2EMP_SEX_STE_NB, SEX_T, STE=STE_AGGREGATE_TOTAL)"

      # --- World Bank economic context ---

      - name: gdp_per_capita_usd
        description: "GDP per capita in current USD (NY.GDP.PCAP.CD). Null when WB has no data for this country/year."

      - name: poverty_headcount_ratio
        description: "Poverty headcount ratio at $2.15/day as % of population (SI.POV.DDAY). Null when WB has no data."

      - name: rural_population_pct
        description: "Rural population as % of total (SP.RUR.TOTL.ZS). Null when WB has no data."

      - name: oda_received_usd
        description: "Net ODA received in current USD (DT.ODA.ALLD.CD). Null when WB has no data."

      # --- ND-GAIN structural vulnerability ---

      - name: gain_vulnerability_score
        description: "ND-GAIN country vulnerability score. Higher = more vulnerable."

      - name: gain_readiness_score
        description: "ND-GAIN adaptive readiness score. Higher = more ready."

      - name: gain_overall_score
        description: "ND-GAIN overall adaptation score (readiness minus vulnerability)."

      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

    tests:
      - unique_country_year

  - name: fct_wage_climate_vulnerability
    description: >
      Optional derived view illustrating one way the mart could be consumed: a
      weighted composite of six reconciled indicators — not a validated index or
      an analytical claim. Each component is normalized to [0,1] via
      PERCENT_RANK() within year, so countries rank relative to peers in the same
      year. Higher score = higher vulnerability. Composite is the mean of non-null
      components; rows with fewer than 2 contributing components are excluded.
      Grain: (country_code, year).

      components_used shows how many of six components contributed; 2–3 is less
      reliable than 5–6 — filter components_used >= 4 for higher confidence.
      Scores are relative within year only, not comparable across years: 0.8 in
      2005 and 0.8 in 2020 mean similar peer ranking, not the same absolute
      conditions. Raw indicator values are retained alongside normalized scores
      for decomposition and sanity-checking.
    meta:
      owner: pipeline
      domain: composite-index
      update_cadence: monthly
    columns:

      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country_code

      - name: country_name
        description: "Canonical country name"
        tests:
          - not_null

      - name: year
        description: "Calendar year of observation"
        tests:
          - not_null

      - name: vulnerability_index
        description: "Composite vulnerability score in [0,1]: mean of non-null normalized component scores. Higher = more vulnerable."
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 1

      - name: components_used
        description: "Number of the six components that contributed to vulnerability_index (max 6)."
        tests:
          - is_between:
              arguments:
                min_value: 2
                max_value: 6

      - name: vulnerability_tier
        description: "High (>=0.66) / Medium (>=0.33) / Low (<0.33) classification of vulnerability_index."
        tests:
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']

      - name: wage_depression_score
        description: "Normalized wage depression score [0,1]. 1 - percentile rank of avg_nominal_earnings_total within year."

      - name: informality_score
        description: "Normalized informality score [0,1]. Percentile rank of informality_rate_total within year."

      - name: gender_gap_score
        description: "Normalized gender wage gap score [0,1]. Percentile rank of gender_wage_gap_pct within year."

      - name: poverty_score
        description: "Normalized poverty score [0,1]. Percentile rank of poverty_headcount_ratio within year."

      - name: climate_exposure_score
        description: "Normalized climate exposure score [0,1]. Percentile rank of gain_vulnerability_score within year."

      - name: low_readiness_score
        description: "Normalized low-readiness score [0,1]. 1 - percentile rank of gain_readiness_score within year."

      - name: avg_nominal_earnings_total
        description: "Raw average nominal earnings, all workers (from fct_labor_conditions)."

      - name: informality_rate_total
        description: "Raw informal employment rate, all workers (from fct_labor_conditions)."

      - name: gender_wage_gap_pct
        description: "Raw gender wage gap percentage (from fct_labor_conditions)."

      - name: poverty_headcount_ratio
        description: "Raw poverty headcount ratio at $2.15/day (from fct_labor_conditions)."

      - name: gain_vulnerability_score
        description: "Raw ND-GAIN vulnerability score (from fct_labor_conditions)."

      - name: gain_readiness_score
        description: "Raw ND-GAIN readiness score (from fct_labor_conditions)."

      - name: gdp_per_capita_usd
        description: "Raw GDP per capita in current USD (from fct_labor_conditions)."

      - name: in_economic
        description: "True if this country is covered by the World Bank WDI pipeline."

      - name: in_gain
        description: "True if this country is covered by the ND-GAIN pipeline."

      - name: in_labor
        description: "True if this country is covered by the ILOSTAT pipeline."

      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

    tests:
      - unique_country_year
