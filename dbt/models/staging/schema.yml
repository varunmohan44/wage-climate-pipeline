version: 2

models:
  - name: stg_economic
    description: >
      Pivoted World Bank WDI data. Wide format — one row per country/year
      with each indicator as its own column. Nulls are intentionally retained;
      filtering occurs at the fact layer. Grain: (country_code, year).
    columns:

      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null

      - name: country_name
        description: "World Bank country name"
        tests:
          - not_null

      - name: year
        description: "Calendar year of observation"
        tests:
          - not_null

      - name: gdp_per_capita_usd
        description: "GDP per capita in current USD (NY.GDP.PCAP.CD). Null when WB has no data."

      - name: poverty_headcount_ratio
        description: "Poverty headcount ratio at $2.15/day as % of population (SI.POV.DDAY). Null when WB has no data."

      - name: rural_population_pct
        description: "Rural population as % of total population (SP.RUR.TOTL.ZS). Null when WB has no data."

      - name: oda_received_usd
        description: "Net official development assistance received in current USD (DT.ODA.ALLD.CD). Null when WB has no data."
      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

  - name: stg_climate
    description: "Staging model for World Bank climate proxy indicators."
    columns:
      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null
      - name: country_name
        description: "World Bank country name"
        tests:
          - not_null
      - name: year
        description: "Calendar year of observation"
        tests:
          - not_null
      - name: access_to_electricity_pct
        description: "Access to electricity as a share of population (EG.ELC.ACCS.ZS). Proxy for adaptation capacity and infrastructure resilience."
      - name: freshwater_withdrawal_pct_internal_resources
        description: "Freshwater withdrawal as % of internal water resources (ER.H2O.FWTL.ZS). Proxy for water stress and climate vulnerability."
      - name: precipitation_mm
        description: "Annual precipitation in millimeters (AG.LND.PRCP.MM). Climate exposure signal."
      - name: arable_land_pct
        description: "Arable land as % of land area (AG.LND.ARBL.ZS). Agricultural vulnerability / climate-sensitive land dependence."
      - name: forest_area_pct
        description: "Forest area as % of land area (AG.LND.FRST.ZS). Ecological resilience and land-use buffer."
      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"

  - name: stg_gain
    description: "Staging model for ND-GAIN vulnerability and readiness scores."
    columns:
      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null
      - name: country_name
        description: "Country name from ND-GAIN"
        tests:
          - not_null
      - name: year
        description: "Calendar year of the ND-GAIN observation"
        tests:
          - not_null
      - name: vulnerability_score
        description: "ND-GAIN vulnerability score"
      - name: vulnerability_rank
        description: "ND-GAIN vulnerability rank"
      - name: readiness_score
        description: "ND-GAIN readiness score"
      - name: readiness_rank
        description: "ND-GAIN readiness rank"
      - name: overall_score
        description: "ND-GAIN overall adaptation score"
      - name: overall_rank
        description: "ND-GAIN overall adaptation rank"
      - name: region
        description: "Geographic region assigned by ND-GAIN"
      - name: income_group
        description: "Income group assigned by ND-GAIN"
      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"

    tests:
      - unique_country_year
