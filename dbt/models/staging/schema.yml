version: 2

models:
  - name: stg_economic
    description: >
      Pivoted World Bank WDI data. Wide format — one row per country/year
      with each indicator as its own column. Nulls are intentionally retained;
      filtering occurs at the fact layer. Grain: (country_code, year).

      Data quality notes: gdp_per_capita_usd and rural_population_pct have broad
      coverage (~95% of countries for recent years). poverty_headcount_ratio is
      survey-based and sparse — most countries report every 3–5 years, so long null
      runs between survey years are expected. oda_received_usd is null for high-income
      countries that do not receive aid.
    meta:
      owner: pipeline
      domain: economic
      update_cadence: annual
      source: World Bank WDI API
    columns:

      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null

      - name: country_name
        description: "World Bank country name"
        tests:
          - not_null

      - name: year
        description: "Calendar year of observation"
        tests:
          - not_null

      - name: gdp_per_capita_usd
        description: "GDP per capita in current USD (NY.GDP.PCAP.CD). Null when WB has no data."
        meta:
          coverage: high
          notes: "Reliable for most countries from 1990 onward."

      - name: poverty_headcount_ratio
        description: "Poverty headcount ratio at $2.15/day as % of population (SI.POV.DDAY). Null when WB has no data."
        meta:
          coverage: low
          notes: >
            Survey-based. Most countries report every 3–5 years; long null runs between
            surveys are normal and expected. Do not interpret null as zero.
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: rural_population_pct
        description: "Rural population as % of total population (SP.RUR.TOTL.ZS). Null when WB has no data."
        meta:
          coverage: high
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: oda_received_usd
        description: "Net official development assistance received in current USD (DT.ODA.ALLD.CD). Null when WB has no data."
        meta:
          coverage: medium
          notes: "Null for high-income countries that do not receive ODA. Not a data gap."

      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

    tests:
      - unique_country_year

  - name: stg_gain
    description: >
      ND-GAIN country vulnerability and readiness scores. Slowly changing dimension —
      scores are updated annually but reflect structural characteristics that shift
      gradually. Grain: (country_code, year).

      Data quality notes: ND-GAIN covers ~185 countries back to 1995. Scores are
      composite indices themselves (sub-indices for food, water, health, ecosystem,
      habitat, infrastructure for vulnerability; economic, governance, social for
      readiness). Changes year-over-year are typically small; large swings in a single
      year may indicate a data revision rather than a real shock.
    meta:
      owner: pipeline
      domain: climate
      update_cadence: annual
      source: ND-GAIN Country Index (Notre Dame Global Adaptation Initiative)
    columns:
      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null
      - name: country_name
        description: "Country name from ND-GAIN"
        tests:
          - not_null
      - name: year
        description: "Calendar year of the ND-GAIN observation"
        tests:
          - not_null
      - name: vulnerability_score
        description: "ND-GAIN vulnerability score (0–1). Higher = more exposed and sensitive to climate impacts with less capacity to cope."
        meta:
          coverage: high
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: readiness_score
        description: "ND-GAIN readiness score (0–1). Higher = greater capacity to leverage investment for adaptation."
        meta:
          coverage: high
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: overall_score
        description: "ND-GAIN overall adaptation score (readiness minus vulnerability, rescaled). Higher = better adaptation position."
        meta:
          coverage: high
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

    tests:
      - unique_country_year

  - name: stg_labor
    description: >
      Pivoted ILOSTAT labor data. Wide format — one row per country/year with each
      indicator×sex combination as its own column. Nulls are intentionally retained;
      filtering occurs at the fact layer. Grain: (country_code, year).

      Data quality notes: ILOSTAT coverage for developing countries is uneven.
      avg_nominal_earnings is the sparsest column — many low-income countries either
      do not conduct wage surveys or do not report to ILO, so null rates of 60–70%
      for this column among developing-country rows are normal. informality_rate has
      broader coverage (~50% of country-years). gender_wage_gap_pct is derived from
      occupation-level data and is sparse for countries without detailed labor surveys.
      All values reflect the total economy (economic_activity = total); sectoral
      breakdowns are excluded at ingestion.
    meta:
      owner: pipeline
      domain: labor
      update_cadence: monthly (ILOSTAT releases)
      source: ILOSTAT SDMX API
    columns:

      - name: country_code
        description: "ISO 3166-1 alpha-3 country code"
        tests:
          - not_null

      - name: country_name
        description: "ILOSTAT country name"
        tests:
          - not_null

      - name: year
        description: "Calendar year of observation"
        tests:
          - not_null

      - name: avg_nominal_earnings_total
        description: "Average nominal earnings, all workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_T). Null when ILO has no data."
        meta:
          coverage: low
          notes: "Sparse for low-income countries. Null rates of 60–70% among developing-country rows are expected."

      - name: avg_nominal_earnings_male
        description: "Average nominal earnings, male workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_M). Null when ILO has no data."
        meta:
          coverage: low

      - name: avg_nominal_earnings_female
        description: "Average nominal earnings, female workers (EAR_EHRA_SEX_ECO_CUR_NB, SEX_F). Null when ILO has no data."
        meta:
          coverage: low

      - name: gender_wage_gap_pct
        description: "Gender wage gap by occupation as a percentage (EAR_GGAP_OCU_RT). Null when ILO has no data."
        meta:
          coverage: low
          notes: >
            Derived from occupation-level data. Requires detailed labor force surveys;
            absent for many developing countries. Not range-tested: observed values run
            from -1104% to 97% (e.g. COD, EGY, WSM, ZAF, LBR) — this is the raw ILOSTAT
            indicator, not an ingestion artifact, so no accepted-range test is applied.

      - name: informality_rate_total
        description: "Informal employment rate, all workers (EMP_2IFL_SEX_RT, SEX_T). Null when ILO has no data."
        meta:
          coverage: medium
          notes: "Better coverage than earnings data. ILO modeled estimates fill some gaps for countries without direct surveys."
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: informality_rate_male
        description: "Informal employment rate, male workers (EMP_2IFL_SEX_RT, SEX_M). Null when ILO has no data."
        meta:
          coverage: medium
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: informality_rate_female
        description: "Informal employment rate, female workers (EMP_2IFL_SEX_RT, SEX_F). Null when ILO has no data."
        meta:
          coverage: medium
        tests:
          - is_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: total_employment_nb
        description: >
          Total employment count across all statuses (EMP_2EMP_SEX_STE_NB, SEX_T,
          status_in_employment=STE_AGGREGATE_TOTAL — ILO's current ICSE-18-based
          total classification, chosen over the legacy STE_ICSE93_TOTAL code which
          carries near-identical values). Null when ILO has no data.
        meta:
          coverage: high

      - name: dbt_updated_at
        description: "Timestamp this row was last processed by dbt"
        tests:
          - not_null

    tests:
      - unique_country_year
