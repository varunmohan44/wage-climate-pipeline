# models/staging/sources.yml
#
# Declares the raw Postgres tables as dbt sources.
# This is what allows {{ source('raw', 'raw_economic') }} to resolve
# in staging models, and enables dbt source freshness checks.

version: 2

sources:
  - name: raw
    description: "Raw ingestion layer, written directly by Airflow DAGs, not for transformations"
    schema: raw
    tables:

      - name: raw_economic
        description: "World Bank WDI indicators. One row per country, indicator, year. Loaded by dag_ingest_economic."
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 8, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: country_code
            description: "ISO 3166-1 alpha-3 country code"
          - name: country_name
            description: "World Bank country name"
          - name: indicator_code
            description: "World Bank indicator code (e.g. NY.GDP.PCAP.CD)"
          - name: indicator_name
            description: "Human-readable indicator name"
          - name: year
            description: "Calendar year of observation"
          - name: value
            description: "Indicator value. NULL when World Bank reports no data for that country/year."
          - name: loaded_at
            description: "Timestamp of first ingestion"
          - name: updated_at
            description: "Timestamp of most recent upsert"

      - name: raw_labor
        description: "ILOSTAT wage and labor indicators. One row per country, indicator, sex, economic activity, status in employment, year. Loaded by dag_ingest_ilostat."
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 8, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: country_code
            description: "ISO 3166-1 alpha-3 country code"
          - name: country_name
            description: "ILOSTAT country name"
          - name: indicator_code
            description: "ILOSTAT indicator code (e.g. EAR_4MTH_SEX_ECO_CUR_NB)"
          - name: indicator_name
            description: "Human-readable indicator name"
          - name: sex
            description: "Sex dimension (SEX_M, SEX_F, SEX_T)"
          - name: economic_activity
            description: "Economic activity dimension code"
          - name: status_in_employment
            description: "Status in employment dimension code (e.g. STE_ICSE93_1, _T for total)"
          - name: year
            description: "Calendar year of observation"
          - name: value
            description: "Indicator value"

      
      

      - name: raw_gain
        description: "ND-GAIN country vulnerability and readiness scores loaded by dag_ingest_nd_gain."

      # - name: raw_vulnerability
      #   description: "ND-GAIN country vulnerability and readiness scores"
